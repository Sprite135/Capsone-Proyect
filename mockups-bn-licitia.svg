    <rect x="120" y="115" width="350" height="55" rx="10" class="panel"/>
    <text x="140" y="148" class="ink small" font-weight="700">Filtrar oportunidades</text>
    <rect x="120" y="200" width="350" height="95" rx="10" class="panel"/>
    <text x="140" y="230" class="ink small" font-weight="700">Procesos en seguimiento</text>
    <line x1="140" y1="255" x2="445" y2="255" class="thin"/>
    <text x="170" y="280" class="muted tiny">No hay procesos en seguimiento</text>
    <text x="130" y="335" class="ink screen-title">0</text>
    <text x="245" y="335" class="ink screen-title">0</text>
    <text x="360" y="335" class="ink screen-title">0</text>
  </g>

  <!-- 7 Alertas -->
  <g transform="translate(70 950)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="95" height="360" class="panel"/>
    <text x="20" y="98" class="muted tiny">Seguimiento</text>
    <text x="20" y="132" class="ink tiny" font-weight="700">Alertas</text>
    <text x="120" y="42" class="muted label">NOTIFICACIONES</text>
