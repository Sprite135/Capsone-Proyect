    <text x="344" y="64" class="ink tiny" font-weight="700">Revisar</text>
    <rect x="410" y="45" width="70" height="28" rx="14" class="button"/>
    <text x="423" y="64" class="button-text">Guardar</text>
    <rect x="120" y="110" width="100" height="55" rx="10" class="panel"/>
    <text x="140" y="140" class="ink screen-title">1</text>
    <rect x="240" y="110" width="100" height="55" rx="10" class="panel"/>
    <text x="260" y="140" class="ink screen-title">0</text>
    <rect x="360" y="110" width="100" height="55" rx="10" class="panel"/>
    <text x="380" y="140" class="ink screen-title">4</text>
    <rect x="120" y="205" width="210" height="120" rx="10" class="panel"/>
    <text x="140" y="235" class="ink small" font-weight="700">Nueva regla</text>
    <rect x="140" y="255" width="160" height="26" rx="6" class="soft"/>
    <rect x="140" y="292" width="75" height="26" rx="6" class="soft"/>
    <rect x="235" y="292" width="75" height="26" rx="6" class="soft"/>
    <rect x="350" y="205" width="130" height="120" rx="10" class="panel"/>
    <text x="370" y="235" class="ink small" font-weight="700">Reglas activas</text>
    <line x1="370" y1="260" x2="455" y2="260" class="thin"/>
  </g>

  <!-- 8 Analisis entidades -->
