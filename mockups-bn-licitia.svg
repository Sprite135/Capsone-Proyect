<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500">
  <defs>
    <style>
      .page{fill:#fff}
      .ink{fill:#111;font-family:Arial,Helvetica,sans-serif}
      .muted{fill:#555;font-family:Arial,Helvetica,sans-serif}
      .title{font-size:38px;font-weight:700}
      .subtitle{font-size:19px}
      .screen-title{font-size:22px;font-weight:700}
      .label{font-size:13px;font-weight:700;letter-spacing:2px}
      .small{font-size:13px}
      .tiny{font-size:11px}
      .frame{fill:#fff;stroke:#111;stroke-width:2}
      .panel{fill:#f7f7f7;stroke:#111;stroke-width:1.4}
      .soft{fill:#fff;stroke:#444;stroke-width:1.2}
      .dark{fill:#111}
      .line{stroke:#111;stroke-width:1.4}
      .thin{stroke:#555;stroke-width:1}
      .dash{stroke:#777;stroke-width:1;stroke-dasharray:5 5}
      .button{fill:#111;stroke:#111;stroke-width:1}
      .button-text{fill:#fff;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700}
      .outline-btn{fill:#fff;stroke:#111;stroke-width:1.4}
      .logo{fill:#fff;stroke:#111;stroke-width:2}
    </style>
  </defs>

  <rect class="page" width="1800" height="1500"/>
  <text x="70" y="60" class="ink title">Mockups blanco y negro - LicitIA</text>
  <text x="70" y="92" class="muted subtitle">Wireframes basados en las interfaces principales del sistema</text>

  <!-- 1 Home -->
  <g transform="translate(70 130)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="520" height="52" rx="14" class="panel"/>
    <rect x="20" y="12" width="32" height="28" rx="6" class="logo"/>
    <text x="63" y="31" class="ink small" font-weight="700">LicitIA</text>
    <text x="245" y="31" class="muted tiny">Modulos  Flujo  Vista</text>
    <rect x="390" y="13" width="90" height="26" rx="13" class="outline-btn"/>
    <text x="410" y="31" class="ink tiny" font-weight="700">Ingresar</text>
    <text x="22" y="88" class="muted label">INICIO</text>
    <text x="22" y="130" class="ink screen-title">Encuentra procesos relevantes</text>
    <text x="22" y="158" class="ink screen-title">mide afinidad y activa alertas</text>
    <line x1="22" y1="188" x2="300" y2="188" class="line"/>
    <text x="22" y="215" class="muted small">Centraliza oportunidades, filtros SEACE y alertas.</text>
    <rect x="22" y="245" width="110" height="34" rx="17" class="button"/>
    <text x="42" y="267" class="button-text">Crear cuenta</text>
    <rect x="145" y="245" width="120" height="34" rx="17" class="outline-btn"/>
    <text x="165" y="267" class="ink small" font-weight="700">Ya tengo acceso</text>
    <rect x="335" y="105" width="145" height="155" rx="12" class="panel"/>
    <text x="358" y="140" class="ink screen-title">18</text>
    <text x="358" y="165" class="ink small" font-weight="700">oportunidades</text>
    <line x1="358" y1="200" x2="455" y2="200" class="line"/>
    <line x1="358" y1="220" x2="430" y2="220" class="line"/>
    <line x1="358" y1="240" x2="445" y2="240" class="line"/>
    <rect x="22" y="310" width="140" height="28" rx="14" class="soft"/>
    <text x="40" y="329" class="muted tiny">SEACE sincronizado</text>
  </g>

  <!-- 2 Registro -->
  <g transform="translate(640 130)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="220" height="360" class="panel"/>
    <text x="28" y="42" class="muted label">REGISTRO</text>
    <text x="28" y="82" class="ink screen-title">Configura tu cuenta</text>
    <text x="28" y="108" class="ink screen-title">para oportunidades</text>
    <rect x="28" y="150" width="55" height="45" rx="8" class="soft"/>
    <text x="42" y="178" class="ink small" font-weight="700">30</text>
    <rect x="95" y="150" width="55" height="45" rx="8" class="soft"/>
    <text x="105" y="178" class="ink small" font-weight="700">100%</text>
    <rect x="28" y="225" width="165" height="45" rx="8" class="soft"/>
    <text x="42" y="252" class="ink small" font-weight="700">Roles y permisos</text>
    <text x="255" y="52" class="muted label">CREAR CUENTA</text>
    <text x="255" y="88" class="ink screen-title">Crea tu cuenta</text>
    <rect x="255" y="115" width="220" height="32" rx="16" class="outline-btn"/>
    <text x="310" y="136" class="ink small" font-weight="700">Continuar con Google</text>
    <line x1="255" y1="172" x2="475" y2="172" class="thin"/>
    <rect x="255" y="195" width="100" height="36" rx="8" class="soft"/>
    <rect x="375" y="195" width="100" height="36" rx="8" class="soft"/>
    <rect x="255" y="250" width="100" height="36" rx="8" class="soft"/>
    <rect x="375" y="250" width="100" height="36" rx="8" class="soft"/>
    <rect x="255" y="305" width="220" height="36" rx="18" class="button"/>
    <text x="330" y="327" class="button-text">Crear cuenta</text>
  </g>

  <!-- 3 Login Google -->
  <g transform="translate(1210 130)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="220" height="360" class="panel"/>
    <text x="28" y="42" class="muted label">ACCESO</text>
    <text x="28" y="82" class="ink screen-title">Accede a tu cuenta</text>
    <text x="28" y="108" class="ink screen-title">de licitaciones</text>
    <rect x="28" y="150" width="55" height="45" rx="8" class="soft"/>
    <text x="38" y="178" class="ink small" font-weight="700">SEACE</text>
    <rect x="95" y="150" width="55" height="45" rx="8" class="soft"/>
    <text x="113" y="178" class="ink small" font-weight="700">IA</text>
    <rect x="255" y="45" width="220" height="275" rx="10" class="panel"/>
    <text x="280" y="85" class="ink screen-title">Selecciona cuenta</text>
    <line x1="280" y1="130" x2="450" y2="130" class="thin"/>
    <circle cx="300" cy="165" r="14" class="soft"/>
    <text x="325" y="160" class="ink small" font-weight="700">Sebastian Cumpa</text>
    <text x="325" y="180" class="muted tiny">usuario@gmail.com</text>
    <line x1="280" y1="205" x2="450" y2="205" class="thin"/>
    <text x="300" y="235" class="ink small" font-weight="700">Usar otra cuenta</text>
    <rect x="255" y="330" width="100" height="22" rx="11" class="outline-btn"/>
    <text x="278" y="345" class="muted tiny">Google OAuth</text>
  </g>

  <!-- 4 Dashboard -->
  <g transform="translate(70 540)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="95" height="360" class="panel"/>
    <rect x="20" y="24" width="35" height="35" rx="8" class="logo"/>
    <text x="20" y="98" class="ink tiny" font-weight="700">Dashboard</text>
    <text x="20" y="132" class="muted tiny">Oportunidades</text>
    <text x="20" y="166" class="muted tiny">Alertas</text>
    <text x="120" y="42" class="muted label">VISTA GENERAL</text>
    <text x="120" y="78" class="ink screen-title">Dashboard ejecutivo</text>
    <rect x="345" y="40" width="130" height="30" rx="15" class="outline-btn"/>
    <text x="370" y="60" class="ink tiny" font-weight="700">Actualizar</text>
    <rect x="120" y="115" width="355" height="75" rx="10" class="panel"/>
