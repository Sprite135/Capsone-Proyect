    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="95" height="360" class="panel"/>
    <text x="20" y="98" class="muted tiny">Alertas</text>
    <text x="20" y="132" class="ink tiny" font-weight="700">Analisis</text>
    <text x="120" y="42" class="muted label">ANALISIS DE ENTIDADES</text>
    <text x="120" y="78" class="ink screen-title">Que entidades compran que</text>
    <rect x="340" y="45" width="120" height="30" rx="15" class="outline-btn"/>
    <text x="365" y="65" class="ink tiny" font-weight="700">Periodo</text>
    <rect x="120" y="115" width="80" height="55" rx="10" class="panel"/>
    <text x="140" y="145" class="ink screen-title">-</text>
    <rect x="215" y="115" width="80" height="55" rx="10" class="panel"/>
    <text x="235" y="145" class="ink screen-title">S/-</text>
    <rect x="310" y="115" width="80" height="55" rx="10" class="panel"/>
    <text x="330" y="145" class="ink screen-title">-</text>
    <rect x="405" y="115" width="80" height="55" rx="10" class="panel"/>
    <text x="425" y="145" class="ink screen-title">-</text>
    <rect x="120" y="205" width="170" height="115" rx="10" class="panel"/>
    <text x="140" y="235" class="ink small" font-weight="700">Top entidades</text>
    <line x1="140" y1="265" x2="260" y2="265" class="dash"/>
    <rect x="310" y="205" width="175" height="115" rx="10" class="panel"/>
    <text x="330" y="235" class="ink small" font-weight="700">Por categoria</text>
    <circle cx="395" cy="275" r="28" fill="none" stroke="#111" stroke-width="10"/>
  </g>

  <!-- 9 Configuracion -->
  <g transform="translate(1210 950)">
    <rect width="520" height="360" rx="14" class="frame"/>
    <rect x="0" y="0" width="95" height="360" class="panel"/>
    <text x="20" y="98" class="muted tiny">Analisis</text>
    <text x="20" y="132" class="ink tiny" font-weight="700">Configuracion</text>
    <text x="120" y="42" class="muted label">CONFIGURACION</text>
    <text x="120" y="78" class="ink screen-title">Perfil y preferencias</text>
    <rect x="120" y="110" width="365" height="70" rx="10" class="panel"/>
    <text x="140" y="140" class="ink small" font-weight="700">Configura tu perfil</text>
    <rect x="140" y="153" width="315" height="22" rx="5" class="soft"/>
    <rect x="120" y="210" width="365" height="120" rx="10" class="panel"/>
    <text x="140" y="240" class="ink small" font-weight="700">Keywords preferidas</text>
    <rect x="140" y="260" width="170" height="26" rx="6" class="soft"/>
    <rect x="140" y="295" width="80" height="26" rx="13" class="outline-btn"/>
    <rect x="330" y="260" width="125" height="26" rx="6" class="soft"/>
    <text x="342" y="278" class="muted tiny">Preferidos</text>
  </g>

  <text x="70" y="1410" class="muted subtitle">Figura. Mockups en blanco y negro de interfaces principales: inicio, registro, login, dashboard, oportunidades, seguimiento, alertas, analisis de entidades y configuracion.</text>
</svg>
