    <text x="255" y="212" class="muted tiny">Municipalidad distrital</text>
    <rect x="435" y="177" width="35" height="22" rx="11" class="soft"/>
    <text x="445" y="192" class="ink tiny" font-weight="700">7%</text>
    <rect x="235" y="255" width="255" height="78" rx="10" class="panel"/>
    <text x="255" y="285" class="ink small" font-weight="700">LP-ABR-2026</text>
    <text x="255" y="307" class="muted tiny">Descripcion de objeto completa</text>
  </g>

