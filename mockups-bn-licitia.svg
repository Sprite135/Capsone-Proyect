    <rect x="390" y="220" width="85" height="55" rx="8" class="soft"/>
    <text x="410" y="250" class="ink screen-title">S/0</text>
    <rect x="120" y="305" width="170" height="35" rx="8" class="soft"/>
    <text x="145" y="328" class="muted tiny">Distribucion por rubro</text>
    <rect x="305" y="305" width="170" height="35" rx="8" class="soft"/>
    <text x="335" y="328" class="muted tiny">Top entidades</text>
  </g>

